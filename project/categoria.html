<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categoria — EcoFashion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --marrom-escuro: #6b4a3a;
        --marrom-medio: #9c6b4f;
        --marrom-claro: #c8956d;
        --bege-areia: #e8dcc8;
        --creme: #f5efe3;
        --branco: #ffffff;
        --texto: #2a1f18;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", system-ui, sans-serif;
        background-color: var(--creme);
        color: var(--texto);
        line-height: 1.5;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      .logo {
        font-family: "Poppins", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 16px;
      }

      .header {
        background-color: var(--marrom-escuro);
        color: var(--creme);
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 12px rgba(107, 74, 58, 0.25);
      }

      .header .container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 68px;
      }

      .logo {
        font-size: 1.6rem;
        font-style: italic;
        font-weight: 700;
        text-transform: lowercase;
        color: var(--creme);
      }

      .logo .dot {
        color: var(--marrom-claro);
      }

      .voltar {
        font-size: 0.85rem;
        color: var(--bege-areia);
        font-weight: 500;
        transition: color 0.2s;
      }

      .voltar:hover {
        color: var(--creme);
      }

      .pagina-categoria {
        padding: 32px 0 48px;
      }

      .pagina-categoria h1 {
        font-size: 2rem;
        color: var(--marrom-escuro);
        margin-bottom: 8px;
      }

      .pagina-categoria p {
        color: #4a3828;
        max-width: 520px;
        margin-bottom: 28px;
      }

      .grade {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }

      .card {
        background-color: var(--branco);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 14px rgba(107, 74, 58, 0.12);
        transform: translateY(-3px);
      }

      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 24px rgba(107, 74, 58, 0.2);
      }

      .card-img {
        aspect-ratio: 1 / 1;
        width: 100%;
        background-color: var(--bege-areia);
        position: relative;
        overflow: hidden;
      }

      .card-img img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 12%;
        transform: scale(1.08);
        display: block;
      }

      .card-body {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .card-body .nome {
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--marrom-escuro);
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .preco-atual {
        font-family: "Poppins", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        color: var(--marrom-escuro);
      }

      .avaliacao {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.72rem;
        color: #4a3828;
      }

      .estrelas {
        color: var(--dourado, #c8902a);
        letter-spacing: -1px;
      }

      .rodape {
        background-color: var(--marrom-escuro);
        color: var(--bege-areia);
        padding: 24px 0;
        text-align: center;
        font-size: 0.76rem;
      }

      @media (max-width: 900px) {
        .grade {
          grid-template-columns: repeat(3, 1fr);
          gap: 14px;
        }
      }

      @media (max-width: 640px) {
        .container {
          padding: 0 14px;
        }
        .header .container {
          height: 58px;
          gap: 10px;
        }
        .logo {
          font-size: 1.25rem;
        }
        .voltar {
          font-size: 0.78rem;
          white-space: nowrap;
        }
        .pagina-categoria {
          padding: 22px 0 36px;
        }
        .pagina-categoria h1 {
          font-size: 1.45rem;
        }
        .pagina-categoria p {
          font-size: 0.9rem;
          margin-bottom: 20px;
        }
        .grade {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }
        .card-body {
          padding: 10px;
        }
        .card-body .nome {
          font-size: 0.76rem;
        }
        .preco-atual {
          font-size: 0.92rem;
        }
        .avaliacao {
          font-size: 0.65rem;
          flex-wrap: wrap;
          gap: 4px;
        }
        .rodape {
          padding: 18px 0;
          font-size: 0.7rem;
        }
      }

      @media (max-width: 380px) {
        .container {
          padding: 0 10px;
        }
        .voltar {
          font-size: 0.72rem;
        }
        .pagina-categoria h1 {
          font-size: 1.25rem;
        }
        .grade {
          gap: 10px;
        }
        .card-body .nome {
          font-size: 0.72rem;
        }
      }
    </style>
    <link rel="stylesheet" href="/tema.css" />
    <link rel="stylesheet" href="/produto-detalhe.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="/" class="logo">ecofashion<span class="dot">.</span></a>
        <a href="/" class="voltar">← Voltar à loja</a>
      </div>
    </header>

    <main class="pagina-categoria container">
      <h1 id="titulo">Carregando...</h1>
      <p id="descricao"></p>
      <div class="grade" id="grade"></div>
    </main>

    <footer class="rodape">
      <div class="container">
        © 2026 ecofashion. — moda sustentável e acessórios.
      </div>
    </footer>

    <script src="/catalogo.js"></script>
    <script src="/produto-detalhe.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const estilo = params.get("estilo");
      const info = window.ECOFASHION.estilos[estilo];

      if (!info) {
        document.getElementById("titulo").textContent = "Categoria não encontrada";
        document.getElementById("descricao").textContent = "Volte à loja e escolha um estilo.";
      } else {
        document.title = info.nome + " — EcoFashion";
        document.getElementById("titulo").textContent = info.nome;
        document.getElementById("descricao").textContent = info.desc;

        function estrelasHtml(nota) {
          const cheias = Math.floor(nota);
          const meia = nota % 1 >= 0.5;
          let s = "★".repeat(cheias);
          if (meia) s += "⯨";
          s += "☆".repeat(Math.max(0, 5 - cheias - (meia ? 1 : 0)));
          return s;
        }

        window.estrelasHtml = estrelasHtml;

        const produtos = window.ECOFASHION.porEstilo(estilo);
        document.getElementById("grade").innerHTML = produtos
          .map((p) => window.ECOFASHION_DETALHE.cardHtmlSimples(p))
          .join("");
      }
    </script>
  </body>
</html>
